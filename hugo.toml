baseURL = 'https://ericirwin.io/'
languageCode = 'en-us'
title = 'Eric Irwin'

[module]
  [[module.imports]]
    path = "github.com/lordmathis/hugo-theme-nightfall"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[pagination]
  pagerSize = 10

[menu]
  [[menu.header]]
    name = "about"
    weight = 0
    url = "/about"
  [[menu.header]]
    name = "experience"
    weight = 1
    url = "/experience"
  [[menu.header]]
    name = "blog"
    weight = 2
    url = "/posts"
  [[menu.header]]
    name = "featured"
    weight = 3
    url = "/featured"

[params]
  user = "eirwin"
  hostname = "ericirwin.io"
  openLinksInNewTab = true
  showMetadata = true
  showPublishedDate = true
  showReadingTime = true
  showTags = true
  sitedescription = "Experienced engineer, leader and continuous learner with a passion for Continuous Delivery and all things Delivery Engineering."

  [params.author]
    name = "Eric Irwin"
    email = "Eric.Irwin@gmail.com"
    avatar = "/images/headshot.png"

  [params.styles]
    color = "blue"

